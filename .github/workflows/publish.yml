name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege for any job without its own block. A read-only token means a
# hostile dependency running under `npm ci` cannot push to this repo. The publish
# job below declares exactly what OIDC trusted publishing needs.
permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted for every event (security review 2026-10-15, H2). This repo
    # is PUBLIC and this job runs `npm ci`, which executes the lifecycle scripts
    # of whatever package.json a pull request carries. On the self-hosted
    # dailey-mcp-runners (ARC inside the prod cluster, privileged docker:dind with
    # the docker socket mounted) a fork PR's `preinstall` could become root on a
    # prod worker node. Nothing here needs the cluster: the job builds and
    # smoke-tests a stdio server, and publish already runs on ubuntu-latest. Same
    # move the dashboard made in ci.yml. Previously: runs-on: dailey-mcp-runners
    #
    # Never put a job that runs on pull_request back on a self-hosted runner. A
    # push-only job that truly needs one must also carry:
    #   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # That guard only protects the workflow as written on main: a fork PR can
    # edit this file, so the real boundary is not registering a self-hosted
    # runner to this public repo at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Smoke-test MCP server
        run: |
          # Launch the server with fake creds and check it responds to
          # `initialize` + `tools/list`. The server refuses to start if
          # neither DAILEY_API_TOKEN nor DAILEY_EMAIL is set, so we pass
          # a throwaway email+password. We never hit the Dailey OS API
          # during this probe — tools/list is pure schema.
          node -e '
            const { spawn } = require("child_process");
            const proc = spawn("node", ["dist/index.js"], {
              env: { ...process.env, DAILEY_EMAIL: "ci@test.invalid", DAILEY_PASSWORD: "ci" },
              stdio: ["pipe", "pipe", "pipe"],
            });
            let buf = ""; const got = [];
            proc.stdout.on("data", c => {
              buf += c.toString();
              let i;
              while ((i = buf.indexOf("\n")) !== -1) {
                const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
                if (line) try { got.push(JSON.parse(line)); } catch {}
              }
            });
            const send = (m) => proc.stdin.write(JSON.stringify(m) + "\n");
            send({ jsonrpc: "2.0", id: 1, method: "initialize", params: {
              protocolVersion: "2024-11-05", capabilities: {},
              clientInfo: { name: "ci", version: "0.1" },
            }});
            setTimeout(() => {
              send({ jsonrpc: "2.0", method: "notifications/initialized" });
              send({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} });
            }, 500);
            setTimeout(() => {
              proc.kill("SIGTERM");
              const init = got.find(m => m.id === 1);
              const tools = got.find(m => m.id === 2);
              if (!init || init.error) { console.error("initialize failed:", init); process.exit(1); }
              if (!tools || !tools.result?.tools) { console.error("tools/list failed:", tools); process.exit(1); }
              const n = tools.result.tools.length;
              console.log(`✓ initialize handshake ok`);
              console.log(`✓ tools/list returned ${n} tools`);
              if (n < 25) { console.error(`expected at least 25 tools, got ${n}`); process.exit(1); }
              process.exit(0);
            }, 2500);
          '

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # GitHub-HOSTED runner: OIDC trusted publishing needs the id-token endpoint
    # (ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN) which the self-hosted dailey-mcp-runners
    # did not provide — npm then fell through to no-auth (ENEEDAUTH) / placeholder
    # token (E404). The build job above is GitHub-hosted too (H2, 2026-10-15).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; node 20 ships npm 10.x.
      - run: npm install -g npm@^11.5.1
      - name: Diagnostics (versions + OIDC availability)
        run: |
          echo "node $(node -v)  npm $(npm -v)"
          echo "OIDC id-token endpoint: ${ACTIONS_ID_TOKEN_REQUEST_URL:+PRESENT}${ACTIONS_ID_TOKEN_REQUEST_URL:-MISSING}"
      - run: npm ci
      - run: npm run build
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "Publishing v$PKG_VERSION"
      # Trusted Publishing: no NODE_AUTH_TOKEN. npm exchanges the GitHub OIDC
      # id-token (permissions: id-token: write) with the registry's configured
      # trusted publisher for @daileyos/mcp-server, and attaches build provenance
      # automatically. Configure the trusted publisher in the package's npm
      # settings (repo jonndailey/dailey-mcp, workflow publish.yml) or this 403s.
      - run: npm publish --access public

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          FALLBACK_REF: ${{ github.event.inputs.branch || github.ref_name }}
        run: |
          STATUS="${{ job.status }}"
          # Untrusted commit message arrives via env (never interpolated into the
          # script — prevents shell injection), then first line only, truncated,
          # and JSON-escaped so it can't break the shell or the Slack payload.
          COMMIT="${COMMIT_MSG:-$FALLBACK_REF}"
          COMMIT="${COMMIT%%$'\n'*}"
          COMMIT="${COMMIT:0:72}"
          COMMIT="${COMMIT//\\/\\\\}"
          COMMIT="${COMMIT//\"/\\\"}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO=$(echo "${{ github.repository }}" | cut -d/ -f2)
          if [ "$STATUS" = "success" ]; then
            EMOJI=":white_check_mark:"; COLOR="good"
          else
            EMOJI=":x:"; COLOR="danger"
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"attachments\":[{\"color\":\"$COLOR\",\"title\":\"$EMOJI $REPO: $STATUS\",\"title_link\":\"$RUN_URL\",\"fields\":[{\"title\":\"Commit\",\"value\":\"$COMMIT\",\"short\":false},{\"title\":\"Branch\",\"value\":\"${{ github.ref_name }}\",\"short\":true},{\"title\":\"Workflow\",\"value\":\"${{ github.workflow }}\",\"short\":true}],\"footer\":\"$REPO · Dailey Builds\"}]}"
